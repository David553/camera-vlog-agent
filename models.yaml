# 声明式模型配置。${ENV} 占位符从环境变量（.env）读取；不含任何密钥。
# providers: 任意 OpenAI 兼容端点（百炼/DeepSeek/Moonshot/Ollama/vLLM/OpenRouter…），
#            也支持 anthropic-messages / google-generative-ai 原生协议。
# roles:     每个角色的候选链，按序降级（模态拒收/故障自动切换）。
providers:
  - id: brain-gw
    baseUrl: ${AGENT_BASE_URL}
    apiKeyEnv: AGENT_API_KEY
  - id: vision-gw
    baseUrl: ${VISION_BASE_URL}
    apiKeyEnv: VISION_API_KEY
  # 本地视觉（隐私模式）：装好 ollama 并 pull 模型后取消注释
  # - id: ollama
  #   baseUrl: http://127.0.0.1:11434/v1
  #   local: true

models:
  - id: brain
    provider: brain-gw
    model: ${AGENT_MODEL}
    caps: [text]
  - id: vision
    provider: vision-gw
    model: ${VISION_MODEL}
    caps: [text, image]
  # - id: vision-local
  #   provider: ollama
  #   model: qwen3-vl:8b
  #   caps: [text, image]

roles:
  brain: [brain]
  vision: [vision]
  judge: [vision, brain]

policy:
  localOnly: false   # true 时所有角色只允许 local: true 的 provider（画面不出本机）
  retries: 2         # 429/5xx/网络错误指数退避重试次数
  maxConcurrency: 2  # 云端并发上限
  cache: true        # 相同帧+prompt 哈希缓存，重复打标零上传